name: Autonomous Movie Generation (Ollama)

on:
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Manual trigger for testing
    inputs:
      model:
        description: 'Ollama model to use'
        required: true
        default: 'llama3.2'
        type: choice
        options:
          - llama3.2
          - qwen2.5:3b
          - mistral
          - gemma2:2b

permissions:
  contents: write

jobs:
  generate-movie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install Ollama
        run: |
          echo "📦 Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          which ollama
          echo "✅ Ollama installed"

      - name: Start Ollama service
        run: |
          echo "🚀 Starting Ollama service..."
          # Start ollama in background with output redirected
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV
          
          # Wait for service to be ready
          for i in {1..60}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama service ready"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Ollama failed to start after 60 attempts"
              echo "Last 50 lines of log:"
              tail -50 /tmp/ollama.log
              exit 1
            fi
            echo "⏳ Waiting for Ollama... ($i/60)"
            sleep 1
          done

      - name: Install Pi Agent (Orchestrator)
        run: |
          echo "📦 Installing Pi Coding Agent..."
          # In 2026, this is a standard tool for autonomous workflows
          sudo npm install -g @mariozechner/pi-coding-agent || echo "⚠️ Pi Agent install failed, continuing with python script"

      - name: Pull Ollama models
        env:
          MODEL_NAME: ${{ github.event.inputs.model || 'qwen2.5-coder:7b' }}
        run: |
          echo "📥 Pulling models..."
          # We pull the text model for orchestration/scripting
          ollama pull "$MODEL_NAME"
          
          echo "📋 Available models:"
          ollama list

      - name: Run Movie Generation Pipeline
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.model || 'qwen2.5-coder:7b' }}
          OLLAMA_VIDEO_MODEL: 'wan-video:14b'
          OLLAMA_URL: http://localhost:11434
        run: |
          echo "🎬 Launching Movie Pipeline..."
          # The pipeline is now designed for 20-minute movies + 1.5-minute trailers
          python3 scripts/generate_movie.py
          
      - name: Debug Ollama on failure
        if: failure()
        run: |
          echo "❌ Pipeline failed. Checking Ollama status..."
          curl -s http://localhost:11434/api/tags || echo "Ollama service unreachable"
          echo "Last 100 lines of Ollama log:"
          tail -n 100 /tmp/ollama.log

      - name: Configure Git
        run: |
          git config --global user.name 'autonomousMOVIEMAKER Bot'
          git config --global user.email 'autonomousmoviemaker@github-actions.local'

      - name: Commit and push generated movie files
        run: |
          git add output/
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          git commit -m "🤖 Auto-generated movie script: $(date -u +%Y-%m-%d)"
          
          if git push origin main; then
            echo "✅ Movie files committed and pushed"
          else
            echo "⚠️ Push failed, attempting rebase..."
            git pull --rebase origin main
            git push origin main
          fi
